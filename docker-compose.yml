services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: cityvision
      POSTGRES_USER: cityvision
      POSTGRES_PASSWORD: cityvision
    volumes: [postgis_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cityvision -d cityvision"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://cityvision:cityvision@db:5432/cityvision
      CORS_ORIGINS: http://localhost:5173
      DEMO_MODE: "true"
    ports: ["8000:8000"]
    depends_on:
      db: {condition: service_healthy}
volumes:
  postgis_data:
